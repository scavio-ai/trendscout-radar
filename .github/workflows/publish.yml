name: publish

# Publishes to PyPI on a push to main when the version in pyproject.toml is not
# on PyPI yet. Bump the version and push to release; other pushes skip the upload.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-pypi
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'scavio-ai/trendscout'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # trusted publishing: no PyPI token stored in the repo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ".[dev]" && pytest -q
      - name: Check if version is new
        id: check
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://pypi.org/pypi/trendscout-radar/$VERSION/json")
          if [ "$STATUS" = "200" ]; then
            echo "new=false" >> "$GITHUB_OUTPUT"; echo "trendscout-radar $VERSION already on PyPI, skipping"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"; echo "trendscout-radar $VERSION not on PyPI (HTTP $STATUS), publishing"
          fi
      - name: Build
        if: steps.check.outputs.new == 'true'
        run: pip install build && python -m build
      - name: Publish
        if: steps.check.outputs.new == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1

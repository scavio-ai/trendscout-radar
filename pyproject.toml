[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "trendscout-radar"
version = "0.1.0"
description = "Open-source trend radar for TikTok, YouTube, Reddit, Google and X. See what is rising before everyone else, delivered to Telegram, Discord, Slack or email."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Scavio" }]
keywords = ["trends", "trending", "tiktok", "youtube", "reddit", "google-trends", "social-listening", "exploding-topics"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Environment :: Console",
  "Topic :: Internet",
]
dependencies = [
  "httpx>=0.27,<1",
  "pyyaml>=6,<7",
  "jinja2>=3.1,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
trendscout = "trendscout.cli:main"

[project.urls]
Homepage = "https://trends.scavio.dev"
Source = "https://github.com/scavio-ai/trendscout"
Issues = "https://github.com/scavio-ai/trendscout/issues"

[tool.hatch.build.targets.wheel]
packages = ["trendscout"]

[tool.pytest.ini_options]
testpaths = ["tests"]
